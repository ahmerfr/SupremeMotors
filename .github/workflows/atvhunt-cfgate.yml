name: atvhunt cloudflare gate

# atvhunt 403s AS8075 (GitHub), AS396982 (GCP) and every Bunny edge ASN. Cloudflare
# egresses from AS13335, which is on none of Cloud Armor's three public-cloud sub-lists
# (-aws, -azure, -gcp) and is not one of the two ASNs the operator blocked by hand.
#
# The runner NEVER touches atvhunt -- it only calls the Worker. A Worker runs in the colo
# nearest its CALLER, so a US runner puts it in a US colo and the origin pull leaves from
# a US Cloudflare IP. Called from Pakistan it exits in Asia, which atvhunt already 403s.

on:
  workflow_dispatch:
    inputs:
      n:
        description: how many ids to probe
        default: '12'
      worker:
        description: worker base url
        default: 'https://atvgate.sm-a8c7dd.workers.dev'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER: ${{ inputs.worker }}
      # curl, not urllib: the previous run reported "WORKER-ERR 403" with the body and
      # headers discarded, so it could not distinguish Cloudflare refusing the runner from
      # atvhunt refusing the Worker. cf-ray / cf-mitigated in the headers settle it.
      # Browser UA because workers.dev carries bot management and Python-urllib declares
      # itself a bot.
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
    steps:
      - name: who is this runner
        run: curl -s https://ipinfo.io/json | head -c 300; echo

      - name: response headers of a single call
        run: |
          curl -sS -D - -o /tmp/b.txt -A "$UA" "$WORKER/?id=13365869" | head -25
          echo "=== body ==="
          head -c 600 /tmp/b.txt; echo

      - name: gate
        run: |
          for i in 13365869 13731138 13165993 13430881 13612328 13053195 \
                   13080827 13687072 13539467 10000722 11824355 12989643; do
            printf 'id=%s ' "$i"
            curl -sS -A "$UA" -w ' <- outer=%{http_code}\n' "$WORKER/?id=$i" | head -c 300
          done
