name: atvhunt cloudflare gate

# atvhunt 403s AS8075 (GitHub), AS396982 (GCP) and every Bunny edge ASN. Cloudflare
# egresses from AS13335, which is on none of Cloud Armor's three public-cloud sub-lists
# (-aws, -azure, -gcp) and is not one of the two ASNs the operator blocked by hand.
#
# The runner NEVER touches atvhunt -- it only calls the Worker. A Worker runs in the colo
# nearest its CALLER, so a US runner puts it in a US colo and the origin pull leaves from
# a US Cloudflare IP. Called from Pakistan it would exit in Asia and hit the geo rule.

on:
  workflow_dispatch:
    inputs:
      n:
        description: how many ids to probe
        default: '12'
      worker:
        description: worker base url
        default: 'https://atvgate.sm-a8c7dd.workers.dev'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          WORKER: ${{ inputs.worker }}
          N: ${{ inputs.n }}
        run: |
          # curl, not urllib: we need the RESPONSE HEADERS of a failure. The previous run
          # got "WORKER-ERR 403" from urllib with the body discarded, so we could not tell
          # whether Cloudflare was refusing the runner or atvhunt was refusing the Worker.
          # cf-ray/cf-mitigated in the headers settles it. Browser UA because workers.dev
          # carries Cloudflare bot management and Python-urllib is a declared bot.
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          curl -s https://ipinfo.io/json | head -c 200; echo
          echo "=== headers of one call ==="
          curl -sS -D - -o /tmp/b.txt -A "$UA" "$WORKER/?id=13365869" | head -20
          echo "=== body ==="; head -c 600 /tmp/b.txt; echo
          echo "=== gate, browser UA ==="
          for i in 13365869 13731138 13165993 13430881 13612328 13053195                    13080827 13687072 13539467 10000722 11824355 12989643; do
            curl -sS -A "$UA" -w ' <- outer=%{http_code}
' "$WORKER/?id=$i" | head -c 300
          done
